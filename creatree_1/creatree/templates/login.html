{% extends "base.html" %}
{% block title %}Log in – Creatree{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-shell">
  <a href="{{ url_for('index') }}" class="wordmark wordmark--auth">creatree</a>

  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-card__sub">Log in to keep tending your links.</p>

    <form method="POST" action="{{ url_for('login') }}" class="form">
      <label class="field">
        <span>Username or email</span>
        <input type="text" name="identifier" required autofocus>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required>
      </label>

      <button type="submit" class="btn btn--solid btn--block">Log in</button>
    </form>

    <p class="auth-card__switch">New here? <a href="{{ url_for('signup') }}">Create a tree</a></p>
  </div>
</div>
{% endblock %}
